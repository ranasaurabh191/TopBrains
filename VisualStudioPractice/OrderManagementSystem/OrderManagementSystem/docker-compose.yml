services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_container
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password@123
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password@123' -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ordernetwork
    volumes:
      - logs:/app/logs 

  orderapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderapi_container
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - TZ=Asia/Kolkata  
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - ordernetwork

volumes:
  sqldata:
  logs:     

networks:
  ordernetwork:
    driver: bridge