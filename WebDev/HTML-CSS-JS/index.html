<!DOCTYPE html>
<html>
    <head>
        <title>Practice</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <p id="greet"></p>
        <p id="result"></p>
        <h2 id="res"></h2>
        <script>
            document.getElementById("greet").innerHTML="Hello World";
            var x = 20;
            var y= 43;
            var sum = x+y;
            document.getElementById("result").innerHTML = sum;

            document.getElementById("res").innerHTML = x > y ? `${x} is greater` : `${y} is greater`;
        </script>
    </body>
</html>
